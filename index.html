<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Part Properties Detector</title>
</head>
<body>

      
    <div class="container1">
        
        <div class="Titel">
            <img src="./Logo.svg" id="logo" alt="Logo">
            <h1>Part Properties Detector</h1>
        </div>
        <div class="text">
          <p>A powerful tool to analyze and identify the properties of any car part with precision </p>
          <p>Powered by <Pr>Google Gemini</Pr></p>
        </div>
    <div>
           


         <div class="container2">
                <h3 id="result-text">RESULT: ?</h3>
                <h5 id="result"></h5>
         
          
             <div class="icon-container">
                 <img src="upload-icon.svg" alt="Upload an image" id="icon">
                 
             </div>
                
           
            
             <input type="file" id="image" accept="image/*">
             <label for="image">Upload your image</label>
           </div>


         </div>
        
            
    
    <script>
        document.getElementById("image").addEventListener("change", event => {
            const file = event.target.files[0];
            if (!file) {
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                const icon = document.getElementById("icon");
                icon.src = reader.result;
                icon.style.width = "95%";
                icon.style.height = "95%";
                icon.style.borderRadius = "10px";
            };
            reader.readAsDataURL(file);
        });
    </script>
    <script type="module" src="./script.js"></script>




</body>
</html>
